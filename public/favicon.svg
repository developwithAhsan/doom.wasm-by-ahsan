<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181112"/>
      <stop offset="50%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Fiery DOOM Logo Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="30%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Metallic Gold Highlight -->
    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#dc2626" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Badge with Chamfered Corners -->
  <path d="M 20 4 
           L 108 4 
           L 124 20 
           L 124 108 
           L 108 124 
           L 20 124 
           L 4 108 
           L 4 20 Z" 
        fill="url(#bgGrad)" 
        stroke="#991b1b" 
        stroke-width="3"/>

  <!-- Inner Rim -->
  <path d="M 23 9 
           L 105 9 
           L 119 23 
           L 119 105 
           L 105 119 
           L 23 119 
           L 9 105 
           L 9 23 Z" 
        fill="none" 
        stroke="#450a0a" 
        stroke-width="1.5"
        stroke-dasharray="8 4"/>

  <!-- Corner Rivets -->
  <circle cx="16" cy="16" r="2.5" fill="#71717a" stroke="#27272a" stroke-width="1"/>
  <circle cx="112" cy="16" r="2.5" fill="#71717a" stroke="#27272a" stroke-width="1"/>
  <circle cx="16" cy="112" r="2.5" fill="#71717a" stroke="#27272a" stroke-width="1"/>
  <circle cx="112" cy="112" r="2.5" fill="#71717a" stroke="#27272a" stroke-width="1"/>

  <!-- Iconic DOOM Logo Emblem Group -->
  <g filter="url(#glow)">
    <!-- Main Iconic Stylized 'DOOM' Letterforms in Classic Angled Perspective -->
    <!-- D -->
    <path d="M 14 36 
             L 38 36 
             C 48 36, 52 42, 52 52 
             L 52 76 
             C 52 86, 46 92, 36 92 
             L 14 92 
             L 14 80 
             L 18 80 
             L 18 48 
             L 14 48 Z 
             M 26 48 
             L 34 48 
             C 38 48, 40 51, 40 56 
             L 40 72 
             C 40 77, 38 80, 34 80 
             L 26 80 Z" 
          fill="url(#fireGrad)" 
          stroke="#450a0a" 
          stroke-width="2" 
          stroke-linejoin="round"/>

    <!-- First O -->
    <path d="M 46 44 
             L 64 44 
             C 71 44, 74 48, 74 54 
             L 74 74 
             C 74 80, 71 84, 64 84 
             L 46 84 
             C 39 84, 36 80, 36 74 
             L 36 54 
             C 36 48, 39 44, 46 44 Z 
             M 48 54 
             L 48 74 
             C 48 76, 50 77, 54 77 
             L 56 77 
             C 60 77, 62 76, 62 74 
             L 62 54 
             C 62 52, 60 51, 56 51 
             L 54 51 
             C 50 51, 48 52, 48 54 Z" 
          fill="url(#fireGrad)" 
          stroke="#450a0a" 
          stroke-width="2" 
          stroke-linejoin="round"/>

    <!-- Second O -->
    <path d="M 66 44 
             L 84 44 
             C 91 44, 94 48, 94 54 
             L 94 74 
             C 94 80, 91 84, 84 84 
             L 66 84 
             C 59 84, 56 80, 56 74 
             L 56 54 
             C 56 48, 59 44, 66 44 Z 
             M 68 54 
             L 68 74 
             C 68 76, 70 77, 74 77 
             L 76 77 
             C 80 77, 82 76, 82 74 
             L 82 54 
             C 82 52, 80 51, 76 51 
             L 74 51 
             C 70 51, 68 52, 68 54 Z" 
          fill="url(#fireGrad)" 
          stroke="#450a0a" 
          stroke-width="2" 
          stroke-linejoin="round"/>

    <!-- M -->
    <path d="M 86 36 
             L 98 36 
             L 104 60 
             L 110 36 
             L 122 36 
             L 122 92 
             L 112 92 
             L 112 56 
             L 107 78 
             L 101 78 
             L 96 56 
             L 96 92 
             L 86 92 Z" 
          fill="url(#fireGrad)" 
          stroke="#450a0a" 
          stroke-width="2" 
          stroke-linejoin="round"/>
  </g>

  <!-- Top and Bottom Bevel Highlight Lines for 3D Metal Effect -->
  <line x1="16" y1="37" x2="38" y2="37" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="88" y1="37" x2="120" y2="37" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="64,16 68,26 60,26" fill="#dc2626"/>
  <polygon points="64,112 68,102 60,102" fill="#dc2626"/>
</svg>
