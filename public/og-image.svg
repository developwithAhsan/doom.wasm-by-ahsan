<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#161c27" />
    </linearGradient>

    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="25%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="90%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <radialGradient id="hellGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.75" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2636" stroke-width="1" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#hellGlow)" />

  <!-- Outer Tech Border -->
  <rect x="24" y="24" width="1152" height="582" rx="6" fill="none" stroke="#2a394f" stroke-width="2" stroke-dasharray="12 6" />
  <rect x="32" y="32" width="1136" height="566" rx="4" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#ef4444" stroke-width="4" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#ef4444" stroke-width="4" />
  <path d="M 20 580 L 20 610 L 50 610" fill="none" stroke="#ef4444" stroke-width="4" />
  <path d="M 1150 610 L 1180 610 L 1180 580" fill="none" stroke="#ef4444" stroke-width="4" />

  <!-- Top Status Badge -->
  <g transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#141c28" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="-140" cy="0" r="5" fill="#22c55e" />
    <text x="-120" y="5" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
      OFFICIAL WEBASSEMBLY ENGINE
    </text>
  </g>

  <!-- Large Stylized DOOM Text Group -->
  <g transform="translate(600, 220)" filter="url(#badgeGlow)">
    <!-- D -->
    <path d="M -260 -60 
             L -150 -60 
             C -90 -60, -70 -25, -70 20 
             L -70 80 
             C -70 125, -100 150, -160 150 
             L -260 150 
             L -260 100 
             L -240 100 
             L -240 -10 
             L -260 -10 Z 
             M -200 -10 
             L -170 -10 
             C -150 -10, -130 5, -130 30 
             L -130 70 
             C -130 95, -150 100, -170 100 
             L -200 100 Z" 
          fill="url(#fireGrad)" 
          stroke="#450a0a" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- O 1 -->
    <path d="M -50 -20 
             L 20 -20 
             C 55 -20, 70 0, 70 30 
             L 70 90 
             C 70 120, 55 130, 20 130 
             L -50 130 
             C -85 130, -100 120, -100 90 
             L -100 30 
             C -100 0, -85 -20, -50 -20 Z 
             M -40 20 
             L -40 90 
             C -40 100, -30 105, -15 105 
             L -5 105 
             C 10 105, 20 100, 20 90 
             L 20 20 
             C 20 10, 10 5, -5 5 
             L -15 5 
             C -30 5, -40 10, -40 20 Z" 
          fill="url(#fireGrad)" 
          stroke="#450a0a" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- O 2 -->
    <path d="M 90 -20 
             L 160 -20 
             C 195 -20, 210 0, 210 30 
             L 210 90 
             C 210 120, 195 130, 160 130 
             L 90 130 
             C 55 130, 40 120, 40 90 
             L 40 30 
             C 40 0, 55 -20, 90 -20 Z 
             M 100 20 
             L 100 90 
             C 100 100, 110 105, 125 105 
             L 135 105 
             C 150 105, 160 100, 160 90 
             L 160 20 
             C 160 10, 150 5, 135 5 
             L 125 5 
             C 110 5, 100 10, 100 20 Z" 
          fill="url(#fireGrad)" 
          stroke="#450a0a" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- M -->
    <path d="M 180 -60 
             L 225 -60 
             L 250 40 
             L 275 -60 
             L 320 -60 
             L 320 150 
             L 280 150 
             L 280 20 
             L 260 95 
             L 240 95 
             L 220 20 
             L 220 150 
             L 180 150 Z" 
          fill="url(#fireGrad)" 
          stroke="#450a0a" 
          stroke-width="5" 
          stroke-linejoin="round" />
  </g>

  <!-- Subtitle / Value Proposition -->
  <text x="600" y="420" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4">
    PLAY ORIGINAL DOOM ONLINE IN YOUR BROWSER
  </text>
  <text x="600" y="465" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="1">
    No Downloads • Instant Play • Full Controller &amp; WASD Support • Custom WADs &amp; Mods
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 525)">
    <!-- Pill 1 -->
    <rect x="-440" y="-18" width="200" height="36" rx="6" fill="#141c28" stroke="#334155" stroke-width="1.5" />
    <text x="-340" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      ⚡ PC, MAC &amp; CHROMEBOOK
    </text>

    <!-- Pill 2 -->
    <rect x="-220" y="-18" width="200" height="36" rx="6" fill="#141c28" stroke="#334155" stroke-width="1.5" />
    <text x="-120" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      🎮 GAMEPAD SUPPORT
    </text>

    <!-- Pill 3 -->
    <rect x="20" y="-18" width="200" height="36" rx="6" fill="#141c28" stroke="#334155" stroke-width="1.5" />
    <text x="120" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      💾 CLOUD &amp; LOCAL SAVES
    </text>

    <!-- Pill 4 -->
    <rect x="240" y="-18" width="200" height="36" rx="6" fill="#141c28" stroke="#334155" stroke-width="1.5" />
    <text x="340" y="5" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
      🚀 100% FREE SHAREWARE
    </text>
  </g>
</svg>
